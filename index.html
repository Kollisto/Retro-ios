<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Retro 5 runs only its own scripts and talks to nothing but the weather service. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob:; connect-src 'self' https://api.open-meteo.com; worker-src 'self'; manifest-src 'self';
    object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Retro 5</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Retro 5">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="wall"></canvas>
  <main class="screen">
    <div class="statusbar" aria-hidden="true">
      <span class="sb-time"></span>
      <span class="sb-battery"></span>
    </div>
    <nav class="grid" id="grid"></nav>
    <div class="pager" aria-hidden="true">
      <svg class="lupe" viewBox="0 0 10 10"><circle cx="4" cy="4" r="3" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <line x1="6.2" y1="6.2" x2="9" y2="9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span class="dot"></span>
    </div>
    <footer class="dock">
      <div class="shelf"></div>
      <nav class="dock-apps" id="dock"></nav>
    </footer>
    <div class="chin">
      <button class="home-btn" id="home-btn" aria-label="Домой"><span></span></button>
      <label class="haptic" aria-hidden="true"><input type="checkbox" switch id="haptic"></label>
    </div>
  </main>
  <div class="launch" id="launch" hidden></div>
  <div class="sheet-backdrop" id="sheet" hidden>
    <div class="sheet">
      <button class="btn" id="pick-wall">Выбрать обои из Фото</button>
      <button class="btn" id="reset-wall">Стандартные обои</button>
      <button class="btn cancel" id="cancel-sheet">Отменить</button>
    </div>
  </div>
  <input type="file" id="wall-file" accept="image/*" hidden>
  <script src="i18n.js"></script>
  <script src="wallpaper.js"></script>
  <script src="icons.js"></script>
  <script src="weather.js"></script>
  <script src="app.js"></script>
  <script src="goose.js"></script>
</body>
</html>
